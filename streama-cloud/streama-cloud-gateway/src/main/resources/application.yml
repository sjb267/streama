spring:
  profiles:
    active: dev
  application:
    name: streama-cloud-gateway
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
    gateway:
      routes:
        - id: web
          uri: lb://streama-cloud-web
          predicates:
            - Path=/web/**
          filters:
            - StripPrefix=1

        - id: admin
          uri: lb://streama-cloud-admin
          predicates:
            - Path=/admin/**
          filters:
            - StripPrefix=1
            - AdminFilter

        - id: resource
          uri: lb://streama-cloud-resource
          predicates:
            - Path=/file/**
          filters:
            - StripPrefix=1

        - id: interact
          uri: lb://streama-cloud-interact
          predicates:
            - Path=/interact/**
          filters:
            - StripPrefix=1

  config:
    import:
      - nacos:streama-cloud-gateway-dev.yml?refreshEnabled=true

